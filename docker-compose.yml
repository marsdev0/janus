name: janus
version: '3.8'

services:

  redis:
    image: redis:7.4
    container_name: janus-redis
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_DIR}/redis:/data
    restart: always
    command: redis-server --appendonly yes

  mysql:
    image: mysql:8.0
    container_name: janus-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: janus
    volumes:
      - ${DATA_DIR}/mysql:/var/lib/mysql
