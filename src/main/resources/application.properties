server.port=8090

spring.application.name=janus
spring.data.redis.host='127.0.0.1'
spring.data.redis.port=6379

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/janus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto

janus.upstream.base-url='http://127.0.0.1:28000/v1'
janus.upstream.api-key='123456'
janus.upstream.timeout=60s

janus.quota.credit-limit=2000
janus.quota.recover-stale-minutes=10
janus.quota.reconcile-threshold=100
janus.quota.model-completion-cap.default = 2048
