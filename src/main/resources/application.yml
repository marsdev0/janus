server:
  port: 8090

spring:
  application:
    name: janus
  datasource:
    # url 含 &，YAML 里必须加引号，否则 & 会被当作锚点（anchor）解析报错
    url: "jdbc:mysql://127.0.0.1:3306/janus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

janus:
  upstream:
    base-url: http://127.0.0.1:28000/v1
    api-key: "123456"   # 纯数字串，加引号避免被当整数
    timeout: 60s
  quota:
    credit-limit: 2000
    recover-stale-minutes: 10
    reconcile-threshold: 100
    model-completion-cap:
      default: 2048
