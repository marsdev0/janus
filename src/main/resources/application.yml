server:
  port: 8090

spring:
  application:
    name: janus
  datasource:
    # url contains '&', must be quoted in YAML — otherwise '&' is parsed as an anchor and fails
    url: "jdbc:mysql://127.0.0.1:3306/janus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all  # 持久化保证
      retries: 3
    consumer:
      group-id: janus-audit-writer
      enable-auto-commit: false  # 手动 ack
      max-poll-records: 100  # 批量大小
    listener:
      type: batch        # 批量消费（配合 List<ConsumerRecord> 参数）
      ack-mode: manual   # 手动提交（配合 Acknowledgment 参数；否则 checkAckArg 抛异常）

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

janus:
  upstream:
    base-url: http://127.0.0.1:28000/v1
    api-key: "123456"   # numeric string, quoted to avoid being parsed as a number
    timeout: 60s
  quota:
    credit-limit: 2000
    recover-stale-minutes: 10
    reconcile-threshold: 100
    model-completion-cap:
      default: 2048
  ratelimit:
    window-seconds: 60
    token-limit: 100
    model-limit: 50
    channel-limit: 200
