server:
  port: 8090

spring:
  application:
    name: janus
  datasource:
    # url contains '&', must be quoted in YAML — otherwise '&' is parsed as an anchor and fails
    url: "jdbc:mysql://127.0.0.1:3306/janus?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai"
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

janus:
  upstream:
    base-url: http://127.0.0.1:28000/v1
    api-key: "123456"   # numeric string, quoted to avoid being parsed as a number
    timeout: 60s
  quota:
    credit-limit: 2000
    recover-stale-minutes: 10
    reconcile-threshold: 100
    model-completion-cap:
      default: 2048
  ratelimit:
    window-seconds: 60
    token-limit: 100
    model-limit: 50
    channel-limit: 200
